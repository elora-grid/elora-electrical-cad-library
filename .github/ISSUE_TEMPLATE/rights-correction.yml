name: Rights or attribution correction
description: Provide publisher evidence for a hosting or licensing correction.
title: "[Rights] "
labels: ["rights"]
body:
  - type: input
    id: file
    attributes:
      label: Entry ID and file ID or URL
    validations:
      required: true
  - type: input
    id: evidence
    attributes:
      label: Official publisher terms or licence URL
    validations:
      required: true
  - type: textarea
    id: detail
    attributes:
      label: Applicable restriction, permission or attribution correction
    validations:
      required: true
