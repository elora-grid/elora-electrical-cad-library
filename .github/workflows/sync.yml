name: Refresh public catalogue
on:
  schedule:
    - cron: '17 20 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: refresh-public-catalogue
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm run sync
      - run: npm test
      - run: npm run validate
      - name: Commit changed public metadata
        run: |
          git add data schema equipment openapi.json README.md
          if git diff --cached --quiet; then
            echo "Catalogue is already current."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Refresh public CAD catalogue from Elora"
          git push origin HEAD:main
